name: candle_chart
description: "An independent, embeddable candlestick trading chart widget: pan/zoom, crosshair, draggable price lines, order overlays and position P&L shading."
version: 0.12.0
homepage: https://graphite.trade
repository: https://github.com/AmauryBuguet/candle_chart
issue_tracker: https://github.com/AmauryBuguet/candle_chart/issues
topics:
  - chart
  - candlestick
  - trading
  - finance
  - widget
screenshots:
  - description: Drawings, moving averages, volume and RSI panes, as used in Graphite.
    path: screenshots/drawings_and_indicators.png
  - description: Draggable target, entry and stop lines over the candles.
    path: screenshots/price_lines.png

environment:
  sdk: ^3.10.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Wall time behind an injectable clock, so a host's tests can say what time it is.
  clock: ^1.1.2
  equatable: ^2.0.7
  intl: ^0.20.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
